name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib/" 2>/dev/null || true
          # Aarch64 backend binary packaging history:
          #   - pre-5.7.48: `cc5_aarch64` under bin/ (picked up by bin/* above)
          #   - 5.7.48 → 5.11.x: `cc5_aarch64` at the tarball top-level
          #   - 6.0+: renamed to `cycc_aarch64`, location may be either
          #     bin/ or top-level depending on the release.
          # Cover every layout. Mirror of the agnosys / sankoch handling.
          # See docs/development/issues/2026-04-30-cyrius-cc5-aarch64-packaging.md.
          [ -f "$CYRIUS_DIR/cc5_aarch64" ] && cp "$CYRIUS_DIR/cc5_aarch64" "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"
          [ -f "$CYRIUS_DIR/cycc_aarch64" ] && cp "$CYRIUS_DIR/cycc_aarch64" "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"
          chmod +x "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"* 2>/dev/null || true
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/bin"
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" "$HOME/.cyrius/lib"
          echo "$CYRIUS_VERSION" > "$HOME/.cyrius/current"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV
          # Export the resolved version too — each `run:` block is a separate
          # shell, so without this $CYRIUS_VERSION is EMPTY in later steps and
          # the aarch64-missing error below renders as "from Cyrius  (looked…)".
          echo "CYRIUS_VERSION=$CYRIUS_VERSION" >> $GITHUB_ENV

      - name: Resolve dependencies
        # `--no-lock` is LOAD-BEARING — do not remove it.
        #
        # It was originally added to dodge a Cyrius 6.0.1 bug that truncated
        # cyrius.lock to 0 bytes. That bug is fixed (verified on 6.5.3: plain
        # `cyrius deps` now writes a byte-identical lock), but the flag must
        # stay for a second, more important reason:
        #
        # Plain `cyrius deps` REWRITES cyrius.lock from whatever it just
        # resolved. The following `--verify` step would then be comparing the
        # freshly-resolved lib/ against a lockfile generated from that very
        # same resolve — it can never fail. That silently turns the supply-chain
        # gate into a no-op.
        #
        # Measured on 6.5.3 with one hash in the committed lock corrupted:
        #   deps --no-lock  → verify: 38 verified, 1 failed  (exit 1)  ✅ catches it
        #   deps            → verify: 39 verified, 0 failed  (exit 0)  ❌ gate defeated
        #
        # `--no-lock` skips the lockfile write, so `--verify` compares the
        # resolved lib/ against the COMMITTED hashes — which is the whole point.
        run: cyrius deps --no-lock

      - name: Verify dep hashes
        run: cyrius deps --verify

      - name: Lint
        # Auto-discover so new modules are covered without editing CI.
        # Treat any warning as a failure (fail on any cyrlint "  warn " line).
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr tests/tcyr/*.tcyr tests/bcyr/*.bcyr fuzz/*.fcyr; do
            out=$(cyrius lint "$f" 2>&1)
            echo "$out"
            if echo "$out" | grep -qE '^\s*warn '; then
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Format check
        # MUST use `--check`. Do not go back to diffing `cyrius fmt <file>`
        # stdout against the file — on 6.5.29 that gate is broken TWICE over:
        #
        #   1. `cyrius fmt <file>` (no flag) no longer prints to stdout, it
        #      REWRITES IN PLACE. So the diff compares empty-vs-file and
        #      reports every single file as drifted — the gate fails
        #      unconditionally, on a tree that is perfectly formatted.
        #   2. Rewriting in place also mutates the checkout underneath the
        #      later dist-sync step, which then compares regenerated bundles
        #      against sources CI itself just edited.
        #
        # The 2.2.2 comment this replaces said `--check` was "exit-code-only
        # and emits no stdout". That is no longer true: on 6.5.29 `--check`
        # prints the offending file and first differing line AND exits 1,
        # while leaving the file untouched. Verified both directions on a
        # clean file (exit 0, silent) and a deliberately de-indented one
        # (exit 1, diagnostic, file unmodified).
        run: |
          fail=0
          for f in src/*.cyr programs/*.cyr tests/tcyr/*.tcyr tests/bcyr/*.bcyr fuzz/*.fcyr; do
            cyrius fmt "$f" --check || { echo "needs fmt: $f"; fail=1; }
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Vet
        run: cyrius vet src/main.cyr

      - name: Verify dist bundles are in sync with src/
        run: |
          cyrius distlib
          cyrius distlib core
          fail=0
          for bundle in dist/yukti.cyr dist/yukti-core.cyr; do
            if ! git diff --quiet "$bundle"; then
              echo "ERROR: $bundle is stale. Run 'cyrius distlib [core]' and commit the result."
              git --no-pager diff "$bundle" | head -40
              fail=1
            fi
          done
          [ $fail -eq 0 ] || exit 1
          echo "dist bundles match src/"

      - name: Build (DCE)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/yukti
          echo "yukti: $(wc -c < build/yukti) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/yukti | grep -q "7f45 4c46"

      - name: Cross-build aarch64
        # 2.1.3 unblocked aarch64 cross-builds: yukti src/ migrated 30
        # raw SYS_OPEN/SYS_CLOSE/SYS_UNLINK callers to the stdlib's
        # arch-translating sys_open/sys_close/sys_unlink wrappers, and
        # patra 1.9.2 (bumped from 1.1.1) did the same on its side.
        # Cyrius 5.7.43+ ships an aarch64 backend in the x86_64 release
        # bundle (`cc5_aarch64` through 5.11.x; renamed to `cycc_aarch64`
        # in 6.0+). The remaining direct syscall callers (clock_gettime,
        # mount, socket, write, exit, stat, mkdir) still use raw
        # arch-divergent syscall numbers and are RUNTIME-INCORRECT on
        # aarch64 — that's the held-aarch64 retest work, separate from
        # this gate.
        # See docs/development/issues/2026-04-19-cc5-aarch64-repro.md.
        run: |
          if [ ! -x "$HOME/.cyrius/bin/cycc_aarch64" ] && [ ! -x "$HOME/.cyrius/bin/cc5_aarch64" ]; then
            echo "::error::aarch64 backend missing from Cyrius $CYRIUS_VERSION (looked for cycc_aarch64 and cc5_aarch64) — aarch64 cross-build is required since 2.1.3"
            exit 1
          fi
          CYRIUS_DCE=1 cyrius build --aarch64 src/main.cyr build/yukti-aarch64
          CYRIUS_DCE=1 cyrius build --aarch64 programs/core_smoke.cyr build/core_smoke-aarch64
          for f in fuzz/*.fcyr; do
            name=$(basename "$f" .fcyr)
            CYRIUS_DCE=1 cyrius build --aarch64 "$f" "build/${name}-aarch64"
          done
          for bin in build/yukti-aarch64 build/core_smoke-aarch64 build/*-aarch64; do
            [ -f "$bin" ] || continue
            file "$bin" | grep -q "aarch64" || {
              echo "ERROR: $bin is not an aarch64 ELF"; exit 1; }
          done
          echo "yukti-aarch64: $(wc -c < build/yukti-aarch64) bytes"

      - name: Test
        run: cyrius test tests/tcyr/yukti.tcyr

      - name: Kernel-safe tripwire
        # programs/core_smoke.cyr links ONLY src/core.cyr + src/pci.cyr
        # and asserts every exported kernel-safe const/predicate. Non-zero
        # exit = something alloc/syscall-using leaked into the kernel-safe
        # subset. This must stay green for AGNOS kernel consumption.
        run: |
          CYRIUS_DCE=1 cyrius build programs/core_smoke.cyr build/core_smoke
          ./build/core_smoke

      - name: Fuzz
        run: |
          for f in fuzz/*.fcyr; do
            name=$(basename "$f" .fcyr)
            CYRIUS_DCE=1 cyrius build "$f" "build/$name"
            timeout 10 "build/$name" || { echo "FUZZ CRASH: $name"; exit 1; }
            echo "  $name: ok"
          done

      - name: Bench
        run: cyrius bench tests/bcyr/yukti.bcyr

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        # Matches code lines only — rejects patterns in # comments.
        # Use awk instead of "grep -v '# '" which would eat any line with
        # an inline comment and hide real hits.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          # execve(59) / fork(57) / exec* family — no raw spawn without audit
          scan "raw execve"   'syscall( *59'
          scan "raw fork"     'syscall( *57'
          # sys_system in src/ requires explicit sanitization review
          scan "sys_system"   '\bsys_system\s*('
          # Hardcoded system paths that shouldn't be writable by yukti
          scan "writes to /etc"  '"/etc/'
          scan "writes to /bin"  '"/bin/'
          scan "writes to /sbin" '"/sbin/'
          # Raw numeric syscall numbers (2.3.2). `syscall(87, path)` is unlink on
          # x86_64 but timerfd_gettime on aarch64, where the uninitialised second
          # argument is treated as a pointer the kernel WRITES 32 bytes into. That
          # silently corrupted the test harness's counters: the aarch64 suite
          # reported "182 passed, 0 failed" instead of 658, hiding two real
          # failures. Only a nine-number whitelist (0,1,2,3,9,10,11,60,228) is
          # renumbered by the backend, and lib/syscalls.cyr documents even that as
          # macOS-scoped and KNOWN-INCOMPLETE — so no raw number is safe to rely on.
          # Use the stdlib wrappers (sys_write / sys_exit / xopen / xunlink / …),
          # which resolve per target at compile time.
          # Named SYS_* constants are fine and are what this permits.
          rawsys=$(grep -rEn 'syscall\(\s*[0-9]' src/ programs/ tests/ fuzz/ 2>/dev/null | awk -F: '
            { line=$0; sub(/^[^:]+:[0-9]+:/,"",line); sub(/^[[:space:]]+/,"",line);
              if (substr(line,1,1) != "#") print }')
          if [ -n "$rawsys" ]; then
            echo "FAIL: raw numeric syscall( — use stdlib wrappers or named SYS_* constants"
            echo "$rawsys"
            FAIL=1
          fi
          # Unbounded stack buffers (>= 64KB — force heap review)
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr | tee /tmp/bigbuf.txt
          [ -s /tmp/bigbuf.txt ] && FAIL=1
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md LICENSE cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -q "$VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"
